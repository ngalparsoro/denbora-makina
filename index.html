<!doctype html>
<html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaindegia Adierazle Galeria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: indicator picker → map stage (real Basque Country map with a rolling year odometer, 2/3) beside animated side panels → a player dock (play, timeline with events) docked under map and charts. */
:root{
  --bg:#edf3f4; --surface:#ffffff; --surface-2:#f4f8f9; --ink:#0f2a33; --ink-2:#47636d; --ink-3:#7c949b; --line:#d3e1e4;
  --accent:#c8650c; --accent-2:#e8871e; --accent-soft:#fbe5cf; --on-accent:#ffffff;
  --c-demo:#18738b; --c-eko:#c25a0a; --c-giz:#6a4c9c; --c-ing:#3d7d3a; --c-kul:#a8325e; --on-sec:#ffffff;
  --ramp-lo:#eef3f4; --map-empty:#e3eaec; --muni-stroke:#ffffff; --herr-stroke:#0f2a33;
  --up:#1f7a8c; --down:#c2412d; --eu:#8796a0;
  --console:#0f2a33; --console-ink:#e8f2f4; --console-2:#1d3d48;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c181c; --surface:#122329; --surface-2:#172b32; --ink:#e4f0f2; --ink-2:#9fb8bf; --ink-3:#6f8a92; --line:#24414a;
  --accent:#f0973a; --accent-2:#f5a650; --accent-soft:#3a2614; --on-accent:#1a0e03;
  --c-demo:#4cb0c9; --c-eko:#f29a4a; --c-giz:#a78be0; --c-ing:#79c072; --c-kul:#e07aa0; --on-sec:#0b1a1e;
  --ramp-lo:#1b3038; --map-empty:#1a2d33; --muni-stroke:#0c181c; --herr-stroke:#e4f0f2;
  --up:#4cb0c9; --down:#ef6a52; --eu:#8a9aa3;
  --console:#07272f; --console-ink:#e8f2f4; --console-2:#123e49; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c181c; --surface:#122329; --surface-2:#172b32; --ink:#e4f0f2; --ink-2:#9fb8bf; --ink-3:#6f8a92; --line:#24414a;
  --accent:#f0973a; --accent-2:#f5a650; --accent-soft:#3a2614; --on-accent:#1a0e03;
  --c-demo:#4cb0c9; --c-eko:#f29a4a; --c-giz:#a78be0; --c-ing:#79c072; --c-kul:#e07aa0; --on-sec:#0b1a1e;
  --ramp-lo:#1b3038; --map-empty:#1a2d33; --muni-stroke:#0c181c; --herr-stroke:#e4f0f2;
  --up:#4cb0c9; --down:#ef6a52; --eu:#8a9aa3;
  --console:#07272f; --console-ink:#e8f2f4; --console-2:#123e49; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sec-demo{--sc:var(--c-demo)} .sec-eko{--sc:var(--c-eko)} .sec-giz{--sc:var(--c-giz)} .sec-ing{--sc:var(--c-ing)} .sec-kul{--sc:var(--c-kul)}
[hidden]{display:none!important}
.ptext a{color:var(--sc,var(--accent));white-space:nowrap}
.small{font-size:13px} .muted{color:var(--ink-2)}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 12px}
.brand{display:flex;align-items:center;gap:clamp(14px,2.4vw,26px);flex-wrap:wrap;animation:brandIn .8s cubic-bezier(.2,.9,.25,1)}
@keyframes brandIn{from{opacity:0;transform:translateY(-10px)}}
.brand .logo{margin:0;line-height:0}
.brand .logo img{height:clamp(62px,8.4vw,108px);width:auto;display:block}
.brand .ttl{border-left:3px solid var(--accent-2);padding-left:clamp(12px,1.8vw,20px);display:grid;gap:4px}
.brand .ttl .big{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.4vw,40px);line-height:1;letter-spacing:-.015em;text-wrap:balance}
.brand .ttl .big em{font-style:normal;color:var(--accent)}
.brand .dot{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--c-demo) 0 20%,var(--c-eko) 20% 40%,var(--c-giz) 40% 60%,var(--c-ing) 60% 80%,var(--c-kul) 80%);display:grid;place-items:center;flex:none;animation:spin 14s linear infinite}
.brand .dot::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand small{display:block;font-size:14px;color:var(--ink-2)}
.hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fict{font-size:12px;background:var(--accent-soft);color:var(--ink-2);border-radius:999px;padding:3px 10px}
.fict b{color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* picker */
.picker{display:grid;gap:10px;margin-block:8px 14px}
.dial{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dial button{border:2px solid var(--sc);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;display:flex;align-items:center;gap:8px;font-weight:700;transition:background .25s,color .25s,transform .15s}
.dial button:active{transform:scale(.96)}
.dial .c{width:28px;height:28px;border-radius:50%;background:var(--sc);color:var(--on-sec);display:grid;place-items:center;font-family:var(--f-display)}
.dial button[aria-pressed="true"]{background:var(--sc);color:var(--on-sec)}
.dial button[aria-pressed="true"] .c{background:var(--on-sec);color:var(--sc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .25s,border-color .25s,transform .15s;animation:chipIn .35s backwards}
.chips button:active{transform:scale(.95)}
@keyframes chipIn{from{opacity:0;transform:translateY(6px)}}
.chips button[aria-pressed="true"]{border-color:var(--sc);background:var(--sc);color:var(--on-sec)}
.chips .cd{font:11px var(--f-mono);opacity:.75}
.pin{width:8px;height:8px;border-radius:50%;background:var(--accent-2);display:inline-block}
.pinleg{font-size:12px;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.mapcard{position:relative;overflow:hidden;border:2px solid var(--sc);transition:border-color .4s}
.maphd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:12px 16px 0}
.maphd .k{font:12px var(--f-mono);color:var(--sc);font-weight:600}
.maphd h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.5vw,28px);line-height:1.1;text-wrap:balance}
.maphd h2.swap{animation:titleIn .45s ease}
@keyframes titleIn{from{opacity:0;transform:translateX(-14px)}}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-2);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--sc);color:var(--on-sec)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.mapwrap{position:relative}
#map{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
#map .m{stroke:var(--muni-stroke);stroke-width:.35;vector-effect:non-scaling-stroke}
#map .m:hover{stroke:var(--ink);stroke-width:1.4}
#map .m.sel{stroke:var(--accent-2);stroke-width:2.6}
#map .h{fill:none;stroke:var(--herr-stroke);stroke-width:1.3;vector-effect:non-scaling-stroke;pointer-events:none;stroke-opacity:.85}
#map .h.sel{stroke:var(--accent-2);stroke-width:3.2;stroke-opacity:1}
#map .h.pulse{animation:pulse 1.6s ease-out}
@keyframes pulse{0%{stroke:var(--accent-2);stroke-width:7}100%{stroke-width:1.3}}
#map .b{stroke:var(--surface);stroke-width:.8;vector-effect:non-scaling-stroke;fill-opacity:.88;pointer-events:none}
#map .city circle{fill:var(--ink)}
#map .city text{font:700 12px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
#map .ripple{fill:none;stroke:var(--accent-2);vector-effect:non-scaling-stroke;pointer-events:none}
/* odometer year */
.odo{position:absolute;left:16px;bottom:6px;font-family:var(--f-display);font-weight:800;font-size:clamp(52px,8.5vw,112px);line-height:1;letter-spacing:-.04em;color:var(--sc);opacity:.9;pointer-events:none;display:flex;font-variant-numeric:tabular-nums;transition:color .4s}
.odo .d{height:1em;overflow:hidden;display:inline-block}
.odo .col{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.9,.25,1.15)}
.odo .col span{height:1em;display:block}
@media (max-width:640px){.odo{font-size:44px;bottom:2px}.evcard{padding:8px 10px}.evcard p{display:none}.evcard h4{font-size:16px}}
.zoom{position:absolute;right:12px;top:12px;display:grid;gap:4px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.35;max-width:240px;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s;z-index:3}
.tip b{font-family:var(--f-display);font-size:15px}
.tip .v{font:600 14px var(--f-mono)}
.evcard{position:absolute;left:14px;top:10px;max-width:min(360px,calc(100% - 70px));background:var(--console);color:var(--console-ink);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:5px solid var(--accent-2);animation:evIn .55s cubic-bezier(.2,.9,.25,1.1);z-index:2}
.evcard.out{animation:evOut .4s ease forwards}
@keyframes evIn{from{opacity:0;transform:translateX(-40px) scale(.96)}}
@keyframes evOut{to{opacity:0;transform:translateY(-12px)}}
.evcard .k{font:600 11px var(--f-mono);color:var(--accent-2);letter-spacing:.06em}
.evcard h4{margin:2px 0 4px;font-family:var(--f-display);font-size:19px;line-height:1.15}
.evcard p{margin:0 0 8px;font-size:13.5px;opacity:.88}
.evcard button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:var(--accent-2);color:#1a0e03}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 16px 6px;font-size:12px;color:var(--ink-2)}
.legend svg{display:block;max-width:100%}
.legend text{font:11px var(--f-mono);fill:var(--ink-3)}
.mapnote{font-size:12px;color:var(--ink-3);padding:0 16px 12px}

.side{display:grid;gap:12px}
.panel{padding:14px 16px}
.panel h3{margin:0 0 6px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4vw,46px);line-height:1;color:var(--sc);transition:color .4s}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag b{color:var(--ink)}
.ptext{font-size:14px;color:var(--ink-2);margin:10px 0 0}
.selcard .nm{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.selcard .sub{font-size:12px;color:var(--ink-3)}
.selcard .val{font:600 20px var(--f-mono);margin-top:4px}
.spark{width:100%;height:auto;display:block;margin-top:6px}
.spark text{font:10.5px var(--f-mono);fill:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3);margin:0}
.race{position:relative}
.race .r{position:absolute;left:0;right:0;height:26px;display:grid;grid-template-columns:minmax(0,118px) 1fr 82px;gap:8px;align-items:center;font-size:13px;transition:top .6s cubic-bezier(.3,.8,.3,1);cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
.race .r .bar{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.race .r .bar i{display:block;height:100%;background:var(--sc);border-radius:4px;transition:width .6s cubic-bezier(.3,.8,.3,1),background .4s}
.race .r.on{font-weight:700}
.race .r.on .bar i{background:var(--accent-2)}
.race .r .v{font:12px var(--f-mono);color:var(--ink-2);text-align:right}
.race .r .pos{font:600 11px var(--f-mono);color:var(--ink-3);margin-right:4px}
.nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols ol{margin:0;padding-left:18px;font-size:13px;display:grid;gap:2px}
.cols li button{border:0;background:transparent;padding:0;text-align:left;font-size:13px;color:var(--ink)}
.cols li button:hover{text-decoration:underline}
.cols li span{font:12px var(--f-mono);color:var(--ink-3)}
.fade{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}

/* player dock — under map and charts, stays reachable while scrolling */
.dock{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:20;margin-top:16px;background:var(--console);color:var(--console-ink);border-radius:20px;padding:12px clamp(12px,2vw,20px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;box-shadow:0 14px 34px rgba(5,25,30,.28)}
@media (max-width:720px){.dock{grid-template-columns:auto minmax(0,1fr);gap:6px 12px;padding:8px 12px}.dock .dright{grid-column:1/-1}.ctrls #prev,.ctrls #next{display:none}.ctrls .play{width:46px;height:46px;font-size:17px}.track{padding-top:26px}}
.ctrls{display:flex;gap:6px;align-items:center}
.ctrls button{border:1.5px solid var(--console-2);background:var(--console-2);color:var(--console-ink);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px}
.ctrls .play{width:58px;height:58px;border-radius:50%;padding:0;background:var(--accent-2);border-color:var(--accent-2);color:#1a0e03;font-size:20px;display:grid;place-items:center;position:relative}
.ctrls .play.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent-2);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.tl{min-width:0}
.track{position:relative;padding-top:30px}
.track input{width:100%;accent-color:var(--accent-2);margin:0}
.ev{position:absolute;top:0;transform:translateX(-50%);border:0;background:transparent;color:var(--console-ink);font:600 11px var(--f-mono);padding:0;display:grid;justify-items:center;gap:3px}
.ev b{width:13px;height:13px;transform:rotate(45deg);background:var(--console-2);border:2px solid var(--accent-2);display:block;transition:background .3s,transform .3s}
.ev.found b{background:var(--accent-2);transform:rotate(45deg) scale(1.15)}
.ticks{display:flex;justify-content:space-between;font:11px var(--f-mono);opacity:.55;margin-top:2px}
.dright{display:grid;gap:4px;justify-items:end;text-align:right}
@media (max-width:720px){.dright{justify-items:start;text-align:left;grid-auto-flow:column;align-items:center;justify-content:space-between}.speed{padding:2px 10px;font-size:12px}}
.found{font-size:12.5px;opacity:.85}
.found .gem{color:var(--accent-2);display:inline-block;animation:pop .5s}
@keyframes pop{from{transform:scale(2.2);opacity:0}}
.speed{border:1.5px solid var(--console-2);background:transparent;color:var(--console-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
footer{font-size:12px;color:var(--ink-3);margin-top:16px;max-width:110ch}
footer code{font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== Sober institutional layer: observatory report look — serif headings, hairlines, square corners, muted palette ===== */
:root{
  --bg:#f5f6f6; --surface:#ffffff; --surface-2:#f2f4f4; --ink:#1b262b; --ink-2:#4d5b61; --ink-3:#808d92; --line:#d8dee0;
  --accent:#b3631f; --accent-2:#c9772c; --accent-soft:#f6ebe1;
  --c-demo:#2d6a80; --c-eko:#99582a; --c-giz:#55507f; --c-ing:#4a7342; --c-kul:#7f4766;
  --ramp-lo:#f1f3f3; --map-empty:#e7ebec; --herr-stroke:#1b262b;
  --console:#1f2b30; --console-2:#2e3d43; --up:#2d6a80; --down:#b04a35;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111719; --surface:#171f22; --surface-2:#1c2629; --ink:#e3e8e9; --ink-2:#a3b0b4; --ink-3:#77868b; --line:#2a3639;
  --accent:#d9944f; --accent-2:#d9944f; --accent-soft:#2e241b;
  --c-demo:#6aa3b8; --c-eko:#d0915c; --c-giz:#9b95c8; --c-ing:#87b07c; --c-kul:#c28aa8;
  --ramp-lo:#1d272a; --map-empty:#1e2729; --herr-stroke:#e3e8e9; --console:#0d1416; --console-2:#243034; --up:#6aa3b8; --down:#d77a63}}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#171f22; --surface-2:#1c2629; --ink:#e3e8e9; --ink-2:#a3b0b4; --ink-3:#77868b; --line:#2a3639;
  --accent:#d9944f; --accent-2:#d9944f; --accent-soft:#2e241b;
  --c-demo:#6aa3b8; --c-eko:#d0915c; --c-giz:#9b95c8; --c-ing:#87b07c; --c-kul:#c28aa8;
  --ramp-lo:#1d272a; --map-empty:#1e2729; --herr-stroke:#e3e8e9; --console:#0d1416; --console-2:#243034; --up:#6aa3b8; --down:#d77a63}
body{font-size:15px}
header{border-bottom:1px solid var(--line);padding-block:24px 18px;margin-bottom:8px}
.brand .ttl{border-left:1px solid var(--line)}
.brand .ttl .big{font-weight:600;letter-spacing:-.01em}
.brand .ttl .big em{color:var(--ink-3);font-weight:500}
.brand small{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.fict{border-radius:3px;background:transparent;border:1px solid var(--line);font-size:11.5px}
.lang{border-radius:4px}.lang button{border-radius:3px}
/* section tabs */
.picker{margin-block:4px 16px;gap:0}
.dial{gap:0;border-bottom:1px solid var(--line)}
.dial button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;background:transparent;padding:10px 18px 10px 0;margin-right:18px;font-weight:500;color:var(--ink-2)}
.dial button .c{width:auto;height:auto;background:none;color:var(--sc);font:500 12px var(--f-mono)}
.dial button[aria-pressed="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--sc)}
.dial button[aria-pressed="true"] .c{background:none;color:var(--sc)}
.pinleg{margin-left:auto}
.chips{padding-top:12px;gap:4px}
.chips button{border-radius:3px;border-color:var(--line);font-size:12.5px;padding:4px 10px;animation:none}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips button[aria-pressed="true"] .cd{opacity:.7}
.pin{width:6px;height:6px}
/* cards */
.card{border-radius:4px}
.mapcard{border:1px solid var(--line);border-top:3px solid var(--sc)}

/* ===== Gaindegia brand palette: logo blue #3B9BC0 + logo orange #E3892B, everything else derived from them ===== */

  --accent:#cf7419; --accent-2:#e3892b; --accent-soft:#fbeedd; --on-accent:#ffffff;
  --c-demo:#2b87ad; --c-eko:#d47a1f; --c-giz:#1c5a74; --c-ing:#93561a; --c-kul:#8e3b6b; --on-sec:#ffffff;
  --ramp-lo:#eef5f7; --map-empty:#e4edf0; --herr-stroke:#15313c;
  --up:#2b87ad; --down:#d47a1f; --eu:#8aa0a8;
  --console:#123a4a; --console-ink:#e9f3f6; --console-2:#1d5064;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a20; --surface:#122329; --surface-2:#172c34; --ink:#e3eef2; --ink-2:#a2bac2; --ink-3:#71909a; --line:#23404b;
  --accent:#eb9a4c; --accent-2:#eb9a4c; --accent-soft:#33230f; --on-accent:#1a0e03;
  --c-demo:#5db4d8; --c-eko:#ec9a4f; --c-giz:#9cd0e4; --c-ing:#d9a46c; --c-kul:#e08ab8; --on-sec:#0b1a1e;
  --ramp-lo:#16292f; --map-empty:#17292f; --herr-stroke:#e3eef2;
  --up:#5db4d8; --down:#ec9a4f; --eu:#7f969e;
  --console:#0a2530; --console-ink:#e9f3f6; --console-2:#173f4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a20; --surface:#122329; --surface-2:#172c34; --ink:#e3eef2; --ink-2:#a2bac2; --ink-3:#71909a; --line:#23404b;
  --accent:#eb9a4c; --accent-2:#eb9a4c; --accent-soft:#33230f; --on-accent:#1a0e03;
  --c-demo:#5db4d8; --c-eko:#ec9a4f; --c-giz:#9cd0e4; --c-ing:#d9a46c; --c-kul:#e08ab8; --on-sec:#0b1a1e;
  --ramp-lo:#16292f; --map-empty:#17292f; --herr-stroke:#e3eef2;

/* ---- Europa ---- */
.euhead{margin:34px 0 12px;border-top:3px solid var(--accent-2);padding-top:16px}

.eunone{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(2px)}

.eulist li:hover{background:var(--surface-2)}

.eulist .nmx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eulist .bar{height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.eulist .bar i{display:block;height:100%;background:var(--sc);opacity:.75;border-radius:3px}
.eulist .v{font:11.5px var(--f-mono);color:var(--ink-2);text-align:right}
.eulist li.nb{background:color-mix(in srgb,var(--sc) 8%,transparent)}

/* ---- ikuspegia + konparaketa ---- */
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}

.vtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.vtabs button.noeu{opacity:.55}
.cmpbtn{border:2px solid var(--accent-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:800;font-size:14px;display:inline-flex;gap:8px;align-items:center;transition:background .2s,color .2s}

.cmpt{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.2vw,24px);letter-spacing:0;text-transform:none;color:var(--ink)}
.cmpctl{display:flex;gap:8px;align-items:center}

.cmpsearch ul{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:300px;overflow:auto}
.cmpsearch li{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}

.cmpsearch li.in{font-weight:700}
.cmpsearch li.in::after{content:" ✓";color:var(--accent)}
.cmpsearch li.none{color:var(--ink-3);cursor:default}
.cmpclear{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-2)}
.cmpchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 16px 10px}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--cc);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--cc) 10%,var(--surface))}

.cmpbars .bar{height:12px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cmpbars .bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.cmpbars .v{font:12px var(--f-mono);color:var(--ink-2);text-align:right}

/* ---- adierazle-menua taldeen gainean ---- */
.dial{overflow:visible;position:relative;z-index:35}

.dial .grp .gbtn .car{font-size:10px;margin-left:4px;opacity:.55;transition:transform .2s}

.dial .gsel{display:inline-flex;align-items:center;gap:6px;margin:0 22px 0 -10px;padding:4px 11px;border-radius:999px;background:var(--sc);color:var(--on-sec);font-size:13px;font-weight:700;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;animation:chipIn .3s backwards}

.dial .grp:not(.nohover):hover .gmenu,.dial .grp.open .gmenu,.dial .grp:focus-within:not(.nohover) .gmenu{display:grid}
.dial .gmenu .mi{display:flex;align-items:center;gap:8px;margin:0;padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;text-align:left;white-space:nowrap;transform:none}
.dial .gmenu .mi:hover,.dial .gmenu .mi:focus-visible{background:var(--surface-2)}

.dial .gmenu .mi .cd{font:600 11px var(--f-mono);color:var(--sc);min-width:28px}
.dial .gmenu .mi .mn{overflow:hidden;text-overflow:ellipsis}
.dial .gmenu .mi .pin{margin-left:auto}
@media (max-width:640px){.dial .gmenu{grid-template-columns:1fr;position:fixed;left:12px;right:12px;top:auto;max-width:none}.dial .gsel{max-width:150px}}

<script>
(function(){
const D=window.GAINDEGIA_DATA, U=window.GAINDEGIA_UDAL, G=window.GAINDEGIA_GEO;
const Y0=D.meta.years[0], Y1=D.meta.years[1], YEARS=d3.range(Y0,Y1+1), IDS=Object.keys(D.indicators), IND=id=>D.indicators[id];
const MUNI=new Set(Object.keys(U.ind));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dur=ms=>RM?0:ms;
let LANG='eu'; try{LANG=localStorage.getItem('gj-lang')||'eu';}catch(e){}

const T={
 eu:{sub:"Euskal Herria · Denbora-makina", fict:"<b>Datu errealak</b> · Gaindegia DatuAtaria",
  speed:"Abiadura", found:"Gertaerak", see:"Ikusi",
  lvH:"Herrialdeak", lvU:"Udalerriak", lvNo:"Adierazle honek ez du udalerri mailako daturik",
  eh:"Euskal Herria", heh:"Hego Euskal Herria*", since:y=>`${y}tik`, eu27:"EB27", sel:"Hautatutakoa", selHint:"Egin klik mapan herrialde edo udalerri batean haren bilakaera ikusteko.",
  rank:"Herrialdeen lasterketa", rankR:"Lurraldeen lasterketa", top:"Gorenak", bottom:"Txikienak", darker:"Ilunagoa = balio handiagoa", popLeg:y=>`Zirkulua = biztanleak · kolorea = aldaketa ${y}tik`,
  munis:"udalerri", pinLeg:"udalerri mailako mapa", nodata:"Daturik ez", dataYear:y=>`${y}ko datua`, agg:a=>`${a}ren balioa`, src:"Iturria: DatuAtaria ↗",
  noteU:"Udalerriak: Gaindegiaren DatuAtariko udal datuak; mugak INE eta IGN. Urte batean daturik ez badago, aurreko azken datua erakusten da.", noteH:"Herrialde mailako balioak; herrialdeko daturik ez dagoenean, EAE edo Ipar Euskal Herriko balioa (marraz). Urte batean daturik ez badago, aurreko azken datua.",
  foot:"Prototipoa Gaindegiarentzat. Datuak: Gaindegia, DatuAtaria (datutegia.gaindegia.eus), 2026-11-12an deskargatuak; 50 adierazle. Euskal Herria* = Hego Euskal Herria (EAE + Nafarroa Garaia). Mapak: es-atlas (INE) eta france-geojson (IGN). Teklatua: zuriunea = play, geziak = urtea.",
  zoom:"Zooma: gurpila edo hatzak", inhab:"biztanle", event:"Gertaera"},
 es:{sub:"Euskal Herria · Máquina del tiempo", fict:"<b>Datos reales</b> · DatuAtaria de Gaindegia",
  speed:"Velocidad", found:"Acontecimientos", see:"Ver",
  lvH:"Territorios", lvU:"Municipios", lvNo:"Este indicador no tiene datos municipales",
  eh:"Euskal Herria", heh:"Hego Euskal Herria*", since:y=>`desde ${y}`, eu27:"UE27", sel:"Selección", selHint:"Pulsa en el mapa un territorio o municipio para ver su evolución.",
  rank:"Carrera de territorios", rankR:"Carrera de territorios", top:"Más altos", bottom:"Más bajos", darker:"Más oscuro = valor más alto", popLeg:y=>`Círculo = habitantes · color = cambio desde ${y}`,
  munis:"municipios", pinLeg:"mapa municipal", nodata:"Sin datos", dataYear:y=>`dato de ${y}`, agg:a=>`valor de ${a}`, src:"Fuente: DatuAtaria ↗",
  noteU:"Municipios: datos municipales de DatuAtaria de Gaindegia; límites INE e IGN. Si un año no tiene dato, se muestra el último disponible.", noteH:"Valores por territorio; si un territorio no tiene dato propio, se usa el de la CAV o Iparralde (rayado). Si un año no tiene dato, se muestra el último disponible.",
  foot:"Prototipo para Gaindegia. Datos: Gaindegia, DatuAtaria (datutegia.gaindegia.eus), descargados el 12-11-2026; 50 indicadores. Euskal Herria* = Hego Euskal Herria (CAV + Navarra). Mapas: es-atlas (INE) y france-geojson (IGN). Teclado: espacio = play, flechas = año.",
  zoom:"Zoom: rueda o dedos", inhab:"habitantes", event:"Acontecimiento"}};
const t=(k,...a)=>{const v=T[LANG][k]??T.eu[k]??k; return typeof v==='function'?v(...a):v;};
const nm=o=>(o&&(o[LANG]||o.eu))||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=id=>nm(IND(id).short)||nm(IND(id).name);
const ok=v=>v!=null&&!isNaN(v);
const fmtN=(v,d)=>{try{return new Intl.NumberFormat('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'}).format(v);}catch(e){return (+v).toFixed(d);}};
function fmtV(v,ind,dOver){ if(!ok(v)) return '–'; const u=ind.unit, n=fmtN(v,dOver??ind.decimals);
  if(u==='%'||u==='‰') return LANG==='eu'?u+n:n+' '+u; if(u==='biz/km²') return n+' '+(LANG==='eu'?'biz/km²':'hab/km²');
  if(u==='% BPG') return LANG==='eu'?'%'+n:n+' % PIB'; if(u&&!['indizea','0-10'].includes(u)) return n+' '+u; return n; }
const AREAS=D.areas, REGIONS=D.regions, PARENT=Object.fromEntries(AREAS.map(a=>[a.id,a.p]));
const ALLA=[...AREAS,...REGIONS.filter(r=>!AREAS.find(a=>a.id===r.id))];
const areaName=id=>id==='EH'?t('eh'):id==='HEH'?t('heh'):id==='EU27'?t('eu27'):nm((ALLA.find(a=>a.id===id)||{name:{eu:id}}).name);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---- values: exact, carried forward (last available ≤ year), and with regional fallback ---- */
const hval=(id,h,y)=>{const s=IND(id).series[h]; return s?s[String(y)]:undefined;};
function hlast(id,h,y){ const s=IND(id).series[h]; if(!s) return null; for(let yy=y;yy>=Y0;yy--){const v=s[String(yy)]; if(ok(v)) return {v,y:yy};} return null; }
function areaVal(id,h,y){ const r=hlast(id,h,y); if(r) return {...r,src:h}; const p=PARENT[h]; if(p&&p!==h){const q=hlast(id,p,y); if(q) return {...q,src:p};} return null; }
const firstYear=(id,h)=>{const s=IND(id).series[h]; if(!s) return null; const ys=Object.keys(s).map(Number).filter(y=>ok(s[y])); return ys.length?d3.min(ys):null;};
const mainA=id=>IND(id).main;
function raceAreas(id){ const s=IND(id).series, out=[];
  [['EAE',['AR','BI','GI']],['NG',['NG']],['IEH',['LA','NB','ZU']]].forEach(([r,ch])=>{ const own=ch.filter(c=>s[c]); if(own.length===ch.length||!s[r]) own.forEach(c=>out.push(c)); else out.push(r); });
  return out.map(x=>ALLA.find(a=>a.id===x)); }

/* ---------------- state ---------------- */
const S={ind:'biztanleria', sec:'demo', year:Y0, level:'u', sel:null, playing:false, timer:null, speed:1, found:{}, hold:false};
const SPEEDS=[{ms:1200,l:'1×'},{ms:750,l:'2×'},{ms:420,l:'4×'}];

/* ---------------- geometry ---------------- */
const svg=d3.select('#map'), W=900, H=640;
const muni=topojson.feature(G,G.objects.u).features, herr=topojson.feature(G,G.objects.h).features;
const proj=d3.geoMercator().fitExtent([[18,18],[W-18,H-18]],{type:'FeatureCollection',features:muni});
const path=d3.geoPath(proj);
const UIDX=new Map(U.ids.map((id,i)=>[id,i]));
muni.forEach(f=>{ f.i=UIDX.get(f.id); f.c=proj(d3.geoCentroid(f)); });
const defs=svg.append('defs');
const hatch=defs.append('pattern').attr('id','hatch').attr('patternUnits','userSpaceOnUse').attr('width',6).attr('height',6).attr('patternTransform','rotate(45)');
hatch.append('rect').attr('width',6).attr('height',6).attr('fill','transparent'); hatch.append('line').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',6).attr('stroke','var(--surface)').attr('stroke-width',2).attr('opacity',.55);
const root=svg.append('g');
const gM=root.append('g'), gX=root.append('g').attr('pointer-events','none'), gH=root.append('g'), gB=root.append('g'), gR=root.append('g'), gC=root.append('g');
const mpaths=gM.selectAll('path').data(muni).join('path').attr('class','m').attr('d',path).attr('fill',css('--map-empty'));
const xpaths=gX.selectAll('path').data(herr).join('path').attr('d',path).attr('fill','url(#hatch)').attr('opacity',0);
const hpaths=gH.selectAll('path').data(herr).join('path').attr('class','h').attr('d',path);
const CITIES=['Bilbo','Donostia','Gasteiz','Iruñea','Baiona','Donapaleu','Maule-Lextarre'];
gC.selectAll('g').data(muni.filter(f=>CITIES.includes(f.properties.n))).join('g').attr('class','city')
  .attr('transform',f=>`translate(${f.c})`).call(g=>{g.append('circle').attr('r',2.6);g.append('text').attr('x',5).attr('y',-5).text(f=>f.properties.n==='Maule-Lextarre'?'Maule':f.properties.n);});
let ZK=1;
const zoom=d3.zoom().scaleExtent([1,10]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{ZK=e.transform.k; root.attr('transform',e.transform); gC.selectAll('g').attr('transform',f=>`translate(${f.c}) scale(${1/ZK})`);});
svg.call(zoom);
d3.select('#zin').on('click',()=>svg.transition().duration(300).call(zoom.scaleBy,1.6));
d3.select('#zout').on('click',()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6));
d3.select('#zreset').on('click',()=>svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity));
const sweepDelay=f=>(f.c[0]/W)*520+(f.c[1]/H)*140;

/* ---------------- municipal values (carry forward) ---------------- */
function mlast(id,i,y){ const s=U.ind[id]&&U.ind[id][i]; if(!s) return null; for(let k=y-Y0;k>=0;k--){ if(ok(s[k])) return {v:s[k],y:Y0+k}; } return null; }
function mfirst(id,i){ const s=U.ind[id][i]; for(let k=0;k<s.length;k++) if(ok(s[k])) return {v:s[k],y:Y0+k}; return null; }

/* ---------------- colour scale ---------------- */
let SCALE=null;
const useU=()=>S.level==='u'&&MUNI.has(S.ind);
function buildScale(){
  const lo=css('--ramp-lo'), hi=css('--c-'+IND(S.ind).section);
  if(S.ind==='biztanleria'&&useU()){
    SCALE={type:'bubble', r:d3.scaleSqrt().domain([0,d3.max(U.ind.biztanleria,s=>d3.max(s.filter(ok)))]).range([0,30]), c:d3.scaleDiverging(d3.piecewise(d3.interpolateRgb,[css('--down'),css('--ink-3'),css('--up')])).domain([-30,0,30]).clamp(true)};
    return;
  }
  let vals=[];
  if(useU()) U.ind[S.ind].forEach(s=>s.forEach(v=>vals.push(v)));
  else ALLA.forEach(a=>YEARS.forEach(y=>vals.push(hval(S.ind,a.id,y))));
  vals=vals.filter(ok).sort(d3.ascending);
  if(!vals.length) vals=[0,1];
  const interp=d3.interpolateLab(lo,hi);
  if(S.ind==='dentsitatea'){ SCALE={type:'log', s:d3.scaleSequentialLog(interp).domain([Math.max(1,d3.quantile(vals,.02)),d3.quantile(vals,.995)]).clamp(true)}; return; }
  let ext=[d3.quantile(vals,useU()?.01:0), d3.quantile(vals,useU()?.99:1)];
  if(ext[0]===ext[1]) ext=[ext[0]-1,ext[1]+1];
  if(ext[0]<0&&ext[1]>0){ const m=Math.max(-ext[0],ext[1]); SCALE={type:'div', s:d3.scaleDiverging(d3.piecewise(d3.interpolateRgb,[css('--down'),css('--ramp-lo'),css('--up')])).domain([-m,0,m]).clamp(true)}; return; }
  SCALE={type:'lin', s:d3.scaleSequential(interp).domain(ext).clamp(true)};
}
const colorOf=v=>!ok(v)?css('--map-empty'):SCALE.s(v);
const featVal=(f,y)=>{ if(useU()){ const r=f.i==null?null:mlast(S.ind,f.i,y); return r?r.v:null; } const r=areaVal(S.ind,f.properties.h,y); return r?r.v:null; };

/* ---------------- map paint ---------------- */
function paintMap(mode){
  const y=S.year, d=mode==='sweep'?dur(650):mode==='year'?dur(Math.min(520,SPEEDS[S.speed].ms*.7)):0;
  if(SCALE.type==='bubble'){
    mpaths.interrupt().transition().duration(d).delay(f=>mode==='sweep'?dur(sweepDelay(f)):0).attr('fill',css('--map-empty'));
    const data=muni.filter(f=>f.i!=null).map(f=>{const a=mlast('biztanleria',f.i,y), b=mfirst('biztanleria',f.i); return {f,p:a?a.v:0,p0:b?b.v:null};}).filter(d=>d.p>0).sort((a,b)=>b.p-a.p);
    const cOf=d=>d.p0?SCALE.c((d.p/d.p0-1)*100):css('--ink-3');
    const sel=gB.selectAll('circle').data(data,d=>d.f.id);
    sel.exit().remove();
    sel.enter().append('circle').attr('class','b').attr('cx',d=>d.f.c[0]).attr('cy',d=>d.f.c[1]).attr('r',0).attr('fill',cOf)
      .transition().duration(dur(700)).delay(d=>dur(sweepDelay(d.f))).attr('r',d=>SCALE.r(d.p));
    sel.interrupt().transition().duration(d||1).attr('r',d=>SCALE.r(d.p)).attr('fill',cOf);
    xpaths.attr('opacity',0);
  } else {
    gB.selectAll('circle').interrupt().transition().duration(dur(300)).attr('r',0).remove();
    mpaths.interrupt().transition().duration(d).delay(f=>mode==='sweep'?dur(sweepDelay(f)):0).attr('fill',f=>colorOf(featVal(f,y)));
    xpaths.attr('opacity',f=>{ if(useU()) return 0; const r=areaVal(S.ind,f.properties.h,y); return r&&r.src!==f.properties.h?1:0; });
  }
  mpaths.classed('sel',f=>S.sel&&S.sel.type==='u'&&S.sel.id===f.id);
  hpaths.classed('sel',f=>S.sel&&S.sel.type==='h'&&S.sel.id===f.id);
}
function ripple(){
  if(RM) return;
  const c=[W*.5,H*.42];
  gR.append('circle').attr('class','ripple').attr('cx',c[0]).attr('cy',c[1]).attr('r',10).attr('stroke-width',1.5).attr('opacity',.6)
    .transition().duration(1300).ease(d3.easeCubicOut).attr('r',420).attr('opacity',0).attr('stroke-width',.5).remove();
  hpaths.classed('pulse',false); void document.getElementById('map').getBoundingClientRect(); hpaths.classed('pulse',true);
}

/* ---------------- odometer ---------------- */
const odo=document.getElementById('odo');
odo.innerHTML=String(Y0).split('').map(()=>`<span class="d"><span class="col">${d3.range(10).map(n=>`<span>${n}</span>`).join('')}</span></span>`).join('');
function setOdo(y){ String(y).split('').forEach((ch,i)=>{ odo.children[i].firstChild.style.transform=`translateY(${-(+ch)}em)`; }); }

/* ---------------- legend ---------------- */
function legend(){
  const el=document.getElementById('legend'), ind=IND(S.ind);
  if(SCALE.type==='bubble'){
    const st=[-20,0,20].map(v=>`<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:50%;background:${SCALE.c(v)};display:inline-block"></i>${v>0?'+':''}${v}%</span>`).join('');
    el.innerHTML=`<span>${t('popLeg',Y0)}</span>${st}<svg width="190" height="62" viewBox="0 0 190 62">${[10000,100000,300000].map((p,i)=>{const r=SCALE.r(p), cx=[12,48,120][i];return `<circle cx="${cx}" cy="${58-r}" r="${r}" fill="none" stroke="var(--ink-3)"/><text x="${cx+r+4}" y="${58-r+4}">${fmtN(p/1000,0)}k</text>`;}).join('')}</svg>`;
    el.__x=null; return;
  }
  const w=260,h=10, s=SCALE.s, dom=s.domain(), lo=dom[0], hi=dom[dom.length-1];
  const ticks=SCALE.type==='log'?[10,100,1000,10000].filter(v=>v>=lo&&v<=hi):d3.ticks(lo,hi,4);
  const x=SCALE.type==='log'?d3.scaleLog().domain([lo,hi]).range([0,w]):d3.scaleLinear().domain([lo,hi]).range([0,w]);
  const grad=d3.range(0,1.0001,.1).map(p=>{const v=SCALE.type==='log'?Math.exp(Math.log(lo)+p*(Math.log(hi)-Math.log(lo))):lo+p*(hi-lo); return `<stop offset="${p*100}%" stop-color="${s(v)}"/>`;}).join('');
  const unit=ind.unit?' · '+esc(ind.unit):'';
  const dg=v=>Math.abs(hi-lo)<5&&v%1?(Math.abs(hi-lo)<.5?2:1):0;
  const mv=areaVal(S.ind,mainA(S.ind),S.year);
  el.innerHTML=`<svg width="${w+30}" height="34" viewBox="-12 0 ${w+30} 34"><defs><linearGradient id="lg">${grad}</linearGradient></defs><rect width="${w}" height="${h}" rx="3" fill="url(#lg)"/><path id="legmark" d="M0,-1 l-5,-6 h10z" fill="var(--ink)" opacity="${mv?1:0}" transform="translate(${x(Math.max(lo,Math.min(hi,mv?mv.v:lo)))},${0})"/>${ticks.map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="${h}" y2="${h+4}" stroke="var(--ink-3)"/><text x="${x(v)}" y="${h+16}" text-anchor="middle">${fmtN(v,dg(v))}</text>`).join('')}</svg><span>${SCALE.type==='div'?'':t('darker')}${unit}</span><span style="margin-left:auto">${t('zoom')}</span>`;
  el.__x=x; el.__lo=lo; el.__hi=hi;
}
function moveLegendMark(){ const el=document.getElementById('legend'), m=document.getElementById('legmark'); if(!m||!el.__x) return; const r=areaVal(S.ind,mainA(S.ind),S.year);
  d3.select(m).attr('opacity',r?1:0); if(r) d3.select(m).transition().duration(dur(500)).attr('transform',`translate(${el.__x(Math.max(el.__lo,Math.min(el.__hi,r.v)))},0)`); }

/* ---------------- side panels ---------------- */
function tweenNum(el,to,ind,d){
  if(!ok(to)){ d3.select(el).interrupt(); el.__v=undefined; el.textContent='–'; return; }
  const from=ok(el.__v)?el.__v:to; el.__v=to;
  d3.select(el).interrupt().transition().duration(dur(d??600)).ease(d3.easeCubicOut).tween('text',()=>{const i=d3.interpolateNumber(from,to); return tt=>{el.textContent=fmtV(i(tt),ind);};});
}
function buildNum(){
  const ind=IND(S.ind);
  document.getElementById('pnum').innerHTML=`<h3>${esc(areaName(mainA(S.ind)))} · <span id="ny">${S.year}</span></h3><div class="bignum num" id="bn"></div>
    <div class="tags"><span class="tag" id="nch"></span><span class="tag" id="ndy" hidden></span>${ind.series.EU27?`<span class="tag">${t('eu27')}: <b id="neu"></b></span>`:''}</div>
    <p class="ptext fade">${esc(nm(ind.text))} <a href="${esc(ind.url)}" target="_blank" rel="noopener">${t('src')}</a></p>`;
  updNum(true);
}
function updNum(first){
  const ind=IND(S.ind), y=S.year, a=mainA(S.ind), r=hlast(S.ind,a,y), fy=firstYear(S.ind,a);
  document.getElementById('ny').textContent=y;
  const bn=document.getElementById('bn'); if(first) bn.__v=0;
  if(r){ tweenNum(bn,r.v,ind,first?900:500); bn.classList.remove('muted'); } else { tweenNum(bn,null,ind); }
  const nch=document.getElementById('nch'), ndy=document.getElementById('ndy');
  if(r&&fy!=null&&r.y>fy){ const ch=r.v-hval(S.ind,a,fy); nch.hidden=false; nch.innerHTML=`${ch>0?'▲':ch<0?'▼':'•'} <b>${esc(fmtV(Math.abs(ch),ind))}</b> ${t('since',fy)}`; }
  else { nch.hidden=!(!r); nch.innerHTML=r?'':esc(t('nodata')); }
  if(r&&r.y!==y){ ndy.hidden=false; ndy.textContent=t('dataYear',r.y); } else ndy.hidden=true;
  const e=document.getElementById('neu'); if(e){ const q=hlast(S.ind,'EU27',y); tweenNum(e,q?q.v:null,ind,500); }
}
function selSeries(){
  const ind=IND(S.ind), isSum=ind.unit===''||ind.unit==='M€'||ind.unit==='MW', a=mainA(S.ind), ehS=YEARS.map(yy=>hval(S.ind,a,yy));
  if(!S.sel) return {name:areaName(a),sub:'',s:ehS,ref:null};
  if(S.sel.type==='u'&&useU()){ const i=UIDX.get(S.sel.id); return {name:U.names[i],sub:`${areaName(U.h[i])}`,i,s:U.ind[S.ind][i],ref:isSum?null:ehS}; }
  const h=S.sel.type==='h'?S.sel.id:U.h[UIDX.get(S.sel.id)];
  let s=YEARS.map(yy=>hval(S.ind,h,yy)), name=areaName(h), sub='';
  if(!s.some(ok)&&PARENT[h]&&IND(S.ind).series[PARENT[h]]){ s=YEARS.map(yy=>hval(S.ind,PARENT[h],yy)); sub=t('agg',areaName(PARENT[h])); }
  return {name,sub,s,ref:isSum?null:ehS};
}
function buildSel(){
  const ind=IND(S.ind), o=selSeries(), ps=document.getElementById('psel');

  const w=320,h=110,m={l:6,r:46,t:10,b:18}, all=o.s.concat(o.ref||[]).filter(ok);

  q.oninput=showRes; q.onfocus=showRes; q.onblur=()=>setTimeout(()=>{res.hidden=true;},120);
  q.onkeydown=e=>{ const items=[...res.querySelectorAll('[data-k]')]; let i=items.findIndex(x=>x.classList.contains('act'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!items.length) return; items[i]&&items[i].classList.remove('act'); i=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; items[i].classList.add('act'); items[i].scrollIntoView({block:'nearest'}); }
    if(e.key==='Enter'&&items[i]){ e.preventDefault(); cmpToggle(items[i].dataset.k); setTimeout(()=>document.getElementById('cmpq')&&document.getElementById('cmpq').focus(),0); }
    if(e.key==='Escape'){ res.hidden=true; } e.stopPropagation(); };
  if(L.length&&!noEU){ cmpChart(); cmpBars(); }
}
function cmpChart(){
  const L=cmpList(), items=L.map(k=>itemInfo(k)), all=items.flatMap(it=>it.s.filter(ok));
  const box=document.getElementById('cmpchart'); if(!box) return;
  const w=Math.max(340,Math.round(box.clientWidth||820)),h=Math.round(Math.min(300,Math.max(220,w*.62))),m={l:12,r:64,t:14,b:24};
  const x=d3.scaleLinear().domain([Y0,Y1]).range([m.l,w-m.r]);
  let ext=all.length?d3.extent(all):[0,1]; if(ext[0]===ext[1]){ext[0]-=1;ext[1]+=1;}
  if(ext[0]>0&&ext[0]/ext[1]<.35) ext[0]=0;
  const y=d3.scaleLinear().domain(ext).nice().range([h-m.b,m.t]);
  const sv=d3.select(box).append('svg').attr('viewBox',`0 0 ${w} ${h}`).attr('class','cmpsvg');
  const dg=v=>Math.abs(ext[1]-ext[0])<5&&v%1?1:0;
  y.ticks(5).forEach(v=>{ sv.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(v)).attr('y2',y(v)).attr('stroke','var(--line)');
    sv.append('text').attr('x',w-m.r+6).attr('y',y(v)+4).text(fmtN(v,dg(v))); });
  d3.range(Y0,Y1+1,w<600?5:3).filter(yy=>Y1-yy>=(w<600?3:2)).concat([Y1]).forEach(yy=>sv.append('text').attr('x',x(yy)).attr('y',h-6).attr('text-anchor','middle').text(yy));
  const line=d3.line().defined(ok).x((v,i)=>x(Y0+i)).y(v=>y(v)).curve(d3.curveMonotoneX);
  items.forEach((it,i)=>{
    const p=sv.append('path').attr('d',line(it.s)||'').attr('fill','none').attr('stroke',PAL[i]).attr('stroke-width',L[i]==='a:EH'||L[i].endsWith(':EH')?3.4:2.2).attr('stroke-linejoin','round');
    const Lg=p.node().getTotalLength()||0; if(Lg&&!RM) p.attr('stroke-dasharray',`${Lg} ${Lg}`).attr('stroke-dashoffset',Lg).transition().duration(800).delay(i*60).attr('stroke-dashoffset',0);
    it.s.forEach((v,j)=>{ if(ok(v)&&!ok(it.s[j-1])&&!ok(it.s[j+1])) sv.append('circle').attr('cx',x(Y0+j)).attr('cy',y(v)).attr('r',3.2).attr('fill',PAL[i]); });
  });
  const cur=sv.append('line').attr('class','cur').attr('y1',m.t).attr('y2',h-m.b).attr('stroke','var(--ink)').attr('stroke-dasharray','2 3');
  const dots=sv.append('g');
  const hov=sv.append('line').attr('y1',m.t).attr('y2',h-m.b).attr('stroke','var(--ink-3)').attr('opacity',0);
  const tip=document.createElement('div'); tip.className='tip cmptip';
  sv.append('rect').attr('x',m.l).attr('y',m.t).attr('width',w-m.l-m.r).attr('height',h-m.t-m.b).attr('fill','transparent')
    .on('pointermove',ev=>{ const [px]=d3.pointer(ev), yy=Math.round(x.invert(px)), j=yy-Y0; if(j<0||j>=YEARS.length) return;
      hov.attr('x1',x(yy)).attr('x2',x(yy)).attr('opacity',1);
      const rows=items.map((it,i)=>({it,i,v:it.s[j]})).filter(r=>ok(r.v)).sort((a,b)=>b.v-a.v);
      tip.innerHTML=`<b>${yy}</b>`+(rows.length?rows.map(r=>`<div><i style="background:${PAL[r.i]}"></i>${esc(r.it.name)} <span class="v">${esc(r.it.fmt(r.v))}</span></div>`).join(''):`<div>${t('nodata')}</div>`);
      const rr=box.getBoundingClientRect(); tip.style.left=Math.min(rr.width-130,Math.max(130,ev.clientX-rr.left))+'px'; tip.style.top=(ev.clientY-rr.top)+'px'; tip.style.opacity=1; })
    .on('pointerleave',()=>{ hov.attr('opacity',0); tip.style.opacity=0; })
    .on('click',ev=>{ const [px]=d3.pointer(ev); stop(); setYear(Math.round(x.invert(px))); });
  box.__c={x,y,items,cur,dots,m};
  box.appendChild(tip); cmpCursor(true);
}
function cmpCursor(first){
  const box=document.getElementById('cmpchart'); if(!box||!box.__c) return; const {x,y,items,cur,dots}=box.__c, d=first?0:dur(400);
  cur.transition().duration(d).attr('x1',x(S.year)).attr('x2',x(S.year));
  const pts=items.map((it,i)=>{ const r=lastIn(it.s,S.year-Y0); return r?{i,cx:x(Y0+r.k),cy:y(r.v)}:null; }).filter(Boolean);
  dots.selectAll('circle').data(pts,p=>p.i).join('circle').attr('r',4.6).attr('fill',p=>PAL[p.i]).attr('stroke','var(--surface)').attr('stroke-width',2)
    .transition().duration(d).attr('cx',p=>p.cx).attr('cy',p=>p.cy);
}
function cmpBars(){
  const ol=document.getElementById('cmpbars'); if(!ol) return; const yi=S.year-Y0;
  const rows=cmpList().map((k,i)=>{ const it=itemInfo(k), r=lastIn(it.s,yi); return {k,i,it,v:r?r.v:null,dy:r?Y0+r.k:null}; });
  const okr=rows.filter(r=>ok(r.v)), mx=d3.max(okr,r=>r.v)??1, mn=Math.min(0,d3.min(okr,r=>r.v)??0);
  rows.sort((a,b)=>(ok(b.v)?b.v:-Infinity)-(ok(a.v)?a.v:-Infinity));
  document.getElementById('cmpy').textContent=S.year;
  ol.innerHTML=rows.map((r,n)=>`<li><span class="pos">${ok(r.v)?(n+1)+'.':''}</span><span class="nmx"><i style="background:${PAL[r.i]}"></i>${esc(r.it.name)}</span><span class="bar"><i style="width:${ok(r.v)?Math.max(1.5,(r.v-mn)/((mx-mn)||1)*100):0}%;background:${PAL[r.i]}"></i></span><span class="v">${esc(ok(r.v)?r.it.fmt(r.v):t('nodata'))}${ok(r.v)&&r.dy!==S.year?`<small> (${r.dy})</small>`:''}</span></li>`).join('');
}
function cmpYear(){ if(!CMP.on) return; cmpCursor(false); cmpBars(); }

/* --- map hooks: colours + click to add --- */
const _paintMap=paintMap;
paintMap=function(mode){ _paintMap(mode);
  const on=CMP.on&&VIEW==='eh';
  mpaths.style('stroke',f=>on&&useU()?cmpColor('u:'+f.id):null).style('stroke-width',f=>on&&useU()&&cmpColor('u:'+f.id)?'2.6px':null).classed('cmpd',f=>on&&useU()&&!!cmpColor('u:'+f.id));
  hpaths.style('stroke',f=>on&&!useU()?cmpColor('a:'+f.properties.h):null).style('stroke-width',f=>on&&!useU()&&cmpColor('a:'+f.properties.h)?'3.4px':null);
  mpaths.filter('.cmpd').raise();
};
mpaths.on('click',(e,f)=>{ if(CMP.on&&VIEW==='eh'){ cmpToggle(useU()?'u:'+f.id:'a:'+f.properties.h); return; }
  S.sel=useU()?{type:'u',id:f.id}:{type:'h',id:f.properties.h}; paintMap('now'); buildSel(); updRank(); });
function eClick(f){ if(CMP.on&&VIEW==='eu'){ cmpToggle(EU.level+':'+f.id); return; } EU.sel=f.id===EU.sel?null:f.id; eDraw('now'); eSide(); }
function eCmpStyle(){ const on=CMP.on&&VIEW==='eu'; eG.selectAll('path').style('stroke',f=>on?cmpColor(EU.level+':'+f.id):null).style('stroke-width',f=>on&&cmpColor(EU.level+':'+f.id)?'2.6px':null); }

renderAll(true);
})();
